plugins {
    id 'com.android.application'
    id 'com.google.firebase.crashlytics'
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace 'saneforce.sanzen'
    compileSdk 36

    defaultConfig {
        applicationId "saneforce.sanzen"
        minSdk 23
        targetSdk 36
        versionCode 82
        versionName "1.4.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        //To use java Local(Date) library below api level 26
        multiDexEnabled = true
//        multiDexKeepProguard file('multidex-config.pro')
    }
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled false

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources false

            ndk {
                // SYMBOL_TABLE is faster and usually sufficient for function names
                // FULL provides full line-level debugging info but is much larger
                debugSymbolLevel = 'SYMBOL_TABLE'
            }

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }
    compileOptions {
        //To use java Local(Date) library below api level 26
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    packagingOptions {
        resources {
            pickFirst 'META-INF/NOTICE.md'
            pickFirst 'META-INF/LICENSE.md'
        }
        jniLibs {
            useLegacyPackaging false  // Use uncompressed shared libraries for 16 KB alignment
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    ndkVersion "28.2.13676358"
}

