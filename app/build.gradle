plugins {
    id 'com.android.application'
    id 'com.google.firebase.crashlytics'
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'


android {
    namespace 'saneforce.sanzen'
    compileSdk 35

    defaultConfig {
        applicationId "saneforce.sanzen"
        minSdk 23
        targetSdk 35
        versionCode 55
        versionName "3.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        //To use java Local(Date) library below api level 26
        multiDexEnabled = true
    }
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled false

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources false

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }
    compileOptions {
        //To use java Local(Date) library below api level 26
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    packagingOptions {
        pickFirst 'META-INF/NOTICE.md'
        pickFirst 'META-INF/LICENSE.md'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.8.9'
    implementation 'androidx.navigation:navigation-ui:2.8.9'
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "android.arch.lifecycle:extensions:1.1.1"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "androidx.recyclerview:recyclerview-selection:1.1.0"

    //Google :-
//    implementation 'com.google.android.play:core:1.10.3'
    implementation 'com.google.maps.android:android-maps-utils:3.8.0'
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    implementation 'com.google.android.play:asset-delivery:2.3.0'
    implementation 'com.google.android.play:feature-delivery:2.1.0'
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:app-update:2.1.0'

    implementation "androidx.work:work-runtime:2.10.1"


//    //Nav Graph
//    def nav_version = "2.7.4"
//    implementation "androidx.navigation:navigation-fragment:$nav_version"
//    implementation "androidx.navigation:navigation-ui:$nav_version"

    //Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
//    implementation 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'
    implementation "com.squareup.okhttp3:okhttp:5.0.0-alpha.11"
    implementation "com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.11"

    //Firebase :-
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-crashlytics"
//    implementation "com.google.firebase:firebase-auth:22.1.2"
    implementation platform("com.google.firebase:firebase-bom:33.13.0")

    //To use java Local(Date) library below api level 26
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")

    //dimens
    implementation 'com.intuit.ssp:ssp-android:1.1.0'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'

    //Android Chart :-
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    //Graph View :-
    implementation 'com.jjoe64:graphview:4.2.2'

    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.jakewharton:butterknife:10.2.3'
    implementation 'com.github.siyamed:android-shape-imageview:0.9.3@aar'

    //Permission
    implementation 'io.github.ParkSangGwon:tedpermission-normal:3.3.0'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    //Pdf viewer
//    implementation 'com.github.barteksc:android-pdf-viewer:2.8.2'
//    implementation 'com.github.barteksc:AndroidPdfViewer:master-SNAPSHOT'
//    implementation(name: 'android-pdf-viewer-2.8.2', ext: 'aar')

    //imgCompressor
    implementation 'id.zelory:compressor:2.1.1'

    //imageview
    implementation 'com.squareup.picasso:picasso:2.71828'

    //room
    implementation "androidx.room:room-runtime:2.7.1"
    annotationProcessor "androidx.room:room-compiler:2.7.1"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata:2.8.7"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.8.7"

    //camera
    implementation "androidx.camera:camera-camera2:1.4.2"

    //RxJava
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.5'
    implementation 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'

    //GifImageView
    implementation "pl.droidsonroids.gif:android-gif-drawable:1.2.25"

    //mail
//    implementation 'com.sun.mail:android-mail:1.6.6'
//    implementation 'com.sun.mail:android-activation:1.6.7'

    //AWS S3
    implementation "com.amazonaws:aws-android-sdk-s3:2.79.0"
    implementation "com.amazonaws:aws-android-sdk-core:2.79.0"
    implementation("com.amazonaws:aws-android-sdk-mobile-client:2.51.0") { transitive = true }

    //lottie animations
    implementation 'com.airbnb.android:lottie:6.6.0'

    //Apache commons IO
    implementation 'commons-io:commons-io:2.18.0'
}

